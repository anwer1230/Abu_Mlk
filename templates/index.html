<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مركز سرعة إنجاز — تليجرام</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

    <style>
        :root {
            --tg-blue: #0088cc;
            --tg-blue-light: #54a0ff;
            --tg-blue-dark: #006699;
            --tg-bg: #ffffff;
            --tg-bg-secondary: #f0f0f0;
            --tg-bg-chat: #e6ebf0;
            --tg-text: #222222;
            --tg-text-secondary: #707579;
            --tg-text-light: #999999;
            --tg-border: #d5d9dd;
            --tg-shadow: 0 2px 8px rgba(0,0,0,0.08);
            --tg-radius: 12px;
            --tg-radius-sm: 8px;
            --tg-radius-lg: 24px;
            --tg-transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --tg-left-width: 380px;
            --tg-header-height: 52px;
        }
        [data-theme="dark"] {
            --tg-bg: #1a1a2e;
            --tg-bg-secondary: #242436;
            --tg-bg-chat: #0f0f1a;
            --tg-text: #e8e8e8;
            --tg-text-secondary: #a0a0b0;
            --tg-text-light: #6a6a7a;
            --tg-border: #33334a;
            --tg-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal',sans-serif; }
        body { background:var(--tg-bg); color:var(--tg-text); height:100vh; overflow:hidden; transition:var(--tg-transition); }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--tg-blue); border-radius:4px; }

        /* ===== الحاوية الرئيسية ===== */
        .app-container { display:flex; height:100vh; width:100vw; overflow:hidden; }

        /* ===== Drawer ===== */
        .drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; }
        .drawer-overlay.open { display:block; }
        .drawer {
            position:fixed; top:0; right:0; bottom:0;
            width:var(--tg-left-width); max-width:85%;
            background:var(--tg-bg-secondary);
            border-left:1px solid var(--tg-border);
            transform:translateX(110%);
            transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index:1001; display:flex; flex-direction:column; overflow:hidden;
            box-shadow:var(--tg-shadow);
        }
        .drawer.open { transform:translateX(0); }
        .drawer-header { padding:16px 16px 8px; border-bottom:1px solid var(--tg-border); flex-shrink:0; }
        .drawer-header .profile { display:flex; align-items:center; gap:12px; cursor:pointer; }
        .drawer-header .profile .avatar {
            width:48px; height:48px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:20px; font-weight:700; color:#fff; background:#6c5ce7; flex-shrink:0;
        }
        .drawer-header .profile .info { flex:1; min-width:0; }
        .drawer-header .profile .info .name { font-size:16px; font-weight:700; color:var(--tg-text); }
        .drawer-header .profile .info .phone { font-size:13px; color:var(--tg-text-secondary); }
        .drawer-header .close-btn { background:none; border:none; color:var(--tg-text-secondary); font-size:22px; cursor:pointer; padding:4px; }
        .drawer-menu { flex:1; overflow-y:auto; padding:8px 0; }
        .drawer-menu .menu-item {
            display:flex; align-items:center; gap:12px; padding:10px 16px;
            cursor:pointer; transition:var(--tg-transition);
            border-radius:var(--tg-radius-sm); margin:0 4px;
            color:var(--tg-text); font-size:15px; font-weight:500;
            border:none; background:none; width:100%; text-align:right;
            font-family:'Tajawal',sans-serif;
        }
        .drawer-menu .menu-item:hover { background:var(--tg-border); }
        .drawer-menu .menu-item i { width:24px; text-align:center; color:var(--tg-text-secondary); font-size:18px; }
        .drawer-menu .menu-item .badge-drawer {
            margin-right:auto; background:var(--tg-border);
            padding:0 8px; border-radius:12px; font-size:12px; color:var(--tg-text-secondary);
        }
        .drawer-menu .divider { height:1px; background:var(--tg-border); margin:6px 16px; }
        .drawer-menu .menu-item.add-account { color:var(--tg-blue); }
        .drawer-menu .menu-item.add-account i { color:var(--tg-blue); }
        .drawer-menu .menu-item.add-account:hover { background:rgba(0,136,204,0.08); }

        /* ===== اللوح الأيسر (قائمة المحادثات) ===== */
        .left-pane {
            width:var(--tg-left-width); min-width:var(--tg-left-width);
            display:flex; flex-direction:column; height:100vh;
            background:var(--tg-bg); border-left:1px solid var(--tg-border);
            flex-shrink:0;
        }
        .main-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:8px 14px; height:var(--tg-header-height);
            border-bottom:1px solid var(--tg-border);
            background:var(--tg-bg-secondary); flex-shrink:0;
        }
        .main-header .brand { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:800; color:var(--tg-blue); }
        .main-header .brand i { font-size:28px; }
        .main-header .brand span { color:var(--tg-text); }
        .main-header .actions { display:flex; gap:2px; }
        .main-header .actions button {
            background:none; border:none; color:var(--tg-text-secondary);
            font-size:20px; padding:4px 8px; border-radius:var(--tg-radius-sm);
            transition:var(--tg-transition); cursor:pointer;
        }
        .main-header .actions button:hover { background:var(--tg-border); color:var(--tg-blue); }
        .search-bar { padding:6px 14px; flex-shrink:0; background:var(--tg-bg-secondary); border-bottom:1px solid var(--tg-border); }
        .search-bar .search-wrap {
            display:flex; align-items:center;
            background:var(--tg-bg); border:1px solid var(--tg-border);
            border-radius:var(--tg-radius-lg); padding:0 12px; transition:var(--tg-transition);
        }
        .search-bar .search-wrap:focus-within { border-color:var(--tg-blue); box-shadow:0 0 0 3px rgba(0,136,204,0.15); }
        .search-bar .search-wrap i { color:var(--tg-text-light); font-size:14px; }
        .search-bar .search-wrap input {
            flex:1; background:none; border:none; padding:6px 8px;
            color:var(--tg-text); font-size:14px; outline:none; font-family:'Tajawal',sans-serif;
        }
        .search-bar .search-wrap input::placeholder { color:var(--tg-text-light); }

        /* قائمة المحادثات */
        .chat-list { flex:1; overflow-y:auto; padding:4px 0; background:var(--tg-bg); display:flex; flex-direction:column; }
        .chat-item {
            display:flex; align-items:center; padding:8px 14px; cursor:pointer;
            transition:var(--tg-transition); border-radius:var(--tg-radius-sm);
            margin:0 4px; gap:12px; position:relative;
        }
        .chat-item:hover { background:var(--tg-border); }
        .chat-item.active { background:rgba(0,136,204,0.12); }
        .chat-item .avatar {
            width:48px; height:48px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:700; color:#fff; flex-shrink:0; position:relative;
        }
        .chat-item .avatar .online-dot {
            position:absolute; bottom:0; right:0; width:12px; height:12px;
            border-radius:50%; background:#4cd964; border:2px solid var(--tg-bg);
        }
        .chat-item .info { flex:1; min-width:0; }
        .chat-item .info .row1 { display:flex; justify-content:space-between; align-items:baseline; }
        .chat-item .info .name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-item .info .time { font-size:11px; color:var(--tg-text-light); flex-shrink:0; }
        .chat-item .info .preview { font-size:14px; color:var(--tg-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-item .badge {
            background:var(--tg-blue); color:#fff; border-radius:50%; font-size:11px;
            padding:0 6px; min-width:20px; height:20px;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .chat-item .skeleton { animation:skeleton-pulse 1.2s ease-in-out infinite; }
        @keyframes skeleton-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* حالة فارغة */
        .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:var(--tg-text-secondary); }
        .empty-state i { font-size:48px; opacity:0.3; }
        .empty-state p { font-size:14px; }

        /* ===== اللوح الأيمن (نافذة المحادثة) ===== */
        .right-pane { flex:1; display:flex; flex-direction:column; height:100vh; background:var(--tg-bg-chat); overflow:hidden; }

        /* حالة لا يوجد محادثة مختارة */
        .no-chat-state {
            flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:16px; color:var(--tg-text-secondary);
        }
        .no-chat-state i { font-size:64px; opacity:0.2; }
        .no-chat-state h3 { font-size:20px; font-weight:700; opacity:0.5; }
        .no-chat-state p { font-size:14px; opacity:0.4; }

        /* ===== واجهة المحادثة ===== */
        .chat-view { display:none; flex-direction:column; height:100vh; }
        .chat-view.open { display:flex; }

        .chat-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:4px 8px; border-bottom:1px solid var(--tg-border);
            background:var(--tg-bg-secondary); flex-shrink:0; min-height:var(--tg-header-height);
        }
        .chat-header .back { background:none; border:none; color:var(--tg-text); font-size:20px; cursor:pointer; padding:4px; display:none; }
        .chat-header .h-info { display:flex; align-items:center; gap:8px; flex:1; min-width:0; cursor:pointer; }
        .chat-header .h-info .h-avatar {
            width:38px; height:38px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:16px; font-weight:700; color:#fff; flex-shrink:0;
        }
        .chat-header .h-info .h-details { flex:1; min-width:0; }
        .chat-header .h-info .h-details .h-name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-header .h-info .h-details .h-status { font-size:12px; color:var(--tg-text-light); }
        .chat-header .h-info .h-details .h-status.online { color:#4cd964; }
        .chat-header .h-tools { display:flex; gap:2px; }
        .chat-header .h-tools button {
            background:none; border:none; color:var(--tg-text-secondary);
            cursor:pointer; padding:4px 6px; border-radius:var(--tg-radius-sm);
            transition:var(--tg-transition); font-size:18px;
        }
        .chat-header .h-tools button:hover { color:var(--tg-blue); background:var(--tg-border); }

        /* ردّ على رسالة */
        .reply-bar {
            display:none; align-items:center; gap:8px; padding:6px 12px;
            background:var(--tg-bg-secondary); border-bottom:1px solid var(--tg-border);
            border-right:3px solid var(--tg-blue); flex-shrink:0;
        }
        .reply-bar.show { display:flex; }
        .reply-bar .reply-text { flex:1; font-size:13px; color:var(--tg-text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .reply-bar .reply-cancel { background:none; border:none; color:var(--tg-text-light); cursor:pointer; font-size:18px; }

        /* ===== الرسائل ===== */
        .messages-area {
            flex:1; overflow-y:auto; padding:10px 16px 4px;
            display:flex; flex-direction:column; gap:2px;
        }
        .msg { display:flex; flex-direction:column; max-width:76%; animation:msgIn 0.2s ease; }
        .msg.sent { align-self:flex-end; }
        .msg.received { align-self:flex-start; }
        @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .msg .bubble {
            padding:7px 12px; border-radius:16px; font-size:14px;
            line-height:1.55; word-wrap:break-word; position:relative;
            cursor:pointer;
        }
        .msg.sent .bubble { background:var(--tg-blue); color:#fff; border-bottom-left-radius:4px; }
        .msg.received .bubble { background:var(--tg-bg); color:var(--tg-text); border-bottom-right-radius:4px; border:1px solid var(--tg-border); }
        .msg .bubble:hover { filter:brightness(0.95); }
        .msg .bubble .sender { font-size:11px; font-weight:700; color:var(--tg-blue-light); margin-bottom:2px; }
        .msg.sent .bubble .sender { color:rgba(255,255,255,0.8); }
        .msg .bubble .text { white-space:pre-wrap; }
        .msg .bubble .foot { font-size:10px; opacity:0.65; margin-top:3px; display:flex; justify-content:flex-end; gap:4px; align-items:center; }
        .msg.sent .bubble .foot { color:rgba(255,255,255,0.75); }
        .msg.received .bubble .foot { color:var(--tg-text-light); }
        .msg .bubble .foot .ticks { letter-spacing:-1px; }
        /* رسالة مرفوضة */
        .msg .bubble.reply-to-preview {
            font-size:12px; padding:4px 8px; border-radius:8px;
            margin-bottom:4px; opacity:0.7;
            background:rgba(0,136,204,0.12); border-right:2px solid var(--tg-blue);
        }
        /* تاريخ الفاصل */
        .date-divider { text-align:center; margin:8px 0; }
        .date-divider span {
            background:rgba(0,136,204,0.12); color:var(--tg-text-secondary);
            font-size:11px; padding:3px 10px; border-radius:12px;
        }
        /* مؤشر الكتابة */
        .typing-indicator { display:none; align-self:flex-start; margin:4px 0; }
        .typing-indicator.show { display:flex; }
        .typing-indicator .bubble { background:var(--tg-bg); border:1px solid var(--tg-border); padding:8px 14px; border-radius:16px; border-bottom-right-radius:4px; }
        .typing-dots { display:flex; gap:3px; align-items:center; height:14px; }
        .typing-dots span { width:6px; height:6px; background:var(--tg-text-light); border-radius:50%; animation:typingDot 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typingDot { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-4px);opacity:1} }

        /* ===== شريط الإدخال ===== */
        .input-area {
            display:flex; align-items:flex-end; gap:6px; padding:6px 10px;
            border-top:1px solid var(--tg-border); background:var(--tg-bg-secondary); flex-shrink:0;
        }
        .input-area .input-wrap {
            flex:1; display:flex; align-items:flex-end;
            background:var(--tg-bg); border:1px solid var(--tg-border);
            border-radius:var(--tg-radius-lg); padding:4px 10px;
            transition:var(--tg-transition); gap:4px;
        }
        .input-area .input-wrap:focus-within { border-color:var(--tg-blue); box-shadow:0 0 0 3px rgba(0,136,204,0.12); }
        .input-area .input-wrap .icon-btn { background:none; border:none; color:var(--tg-text-secondary); cursor:pointer; padding:4px 2px; font-size:20px; transition:var(--tg-transition); flex-shrink:0; }
        .input-area .input-wrap .icon-btn:hover { color:var(--tg-blue); }
        .input-area .input-wrap textarea {
            flex:1; background:none; border:none; color:var(--tg-text);
            padding:4px 0; font-size:14px; resize:none; max-height:100px;
            min-height:28px; font-family:'Tajawal',sans-serif; outline:none; line-height:1.4;
        }
        .input-area .input-wrap textarea::placeholder { color:var(--tg-text-light); }
        .input-area .send-btn {
            background:var(--tg-blue); border:none; color:#fff; width:40px; height:40px;
            border-radius:50%; cursor:pointer; transition:var(--tg-transition);
            font-size:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
        }
        .input-area .send-btn:hover:not(:disabled) { transform:scale(1.08); box-shadow:0 0 20px rgba(0,136,204,0.35); }
        .input-area .send-btn:disabled { opacity:0.45; cursor:not-allowed; }

        /* ===== Toast ===== */
        .toast-container { position:fixed; bottom:20px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:6px; }
        .toast-custom {
            background:var(--tg-bg-secondary); color:var(--tg-text);
            border:1px solid var(--tg-border); border-radius:var(--tg-radius);
            padding:9px 14px; min-width:180px; max-width:300px;
            box-shadow:var(--tg-shadow); animation:toastIn 0.3s ease;
            font-size:13px; border-right:4px solid var(--tg-blue);
            transition:opacity 0.3s, transform 0.3s;
        }
        .toast-custom.success { border-right-color:#4cd964; }
        .toast-custom.error { border-right-color:#ff3b30; }
        .toast-custom.warning { border-right-color:#ffcc00; }
        .toast-custom.fade-out { opacity:0; transform:translateX(40px); }
        @keyframes toastIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }

        /* ===== الاستجابة للشاشات الصغيرة ===== */
        @media (max-width: 820px) {
            .left-pane { width:100%; min-width:100%; position:absolute; inset:0; z-index:1; }
            .left-pane.hidden { display:none; }
            .right-pane { width:100%; min-width:100%; position:absolute; inset:0; z-index:2; }
            .right-pane .chat-view { display:none; }
            .right-pane .chat-view.open { display:flex; }
            .right-pane .no-chat-state { display:none; }
            .chat-header .back { display:block; }
        }

        /* مؤشر التحميل */
        .loading-spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* تحديد نص في القائمة */
        .chat-item * { user-select:none; }
    </style>
</head>
<body>

<!-- ===== Drawer ===== -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <div class="profile">
            <div class="avatar" id="drawerAvatar">؟</div>
            <div class="info">
                <div class="name" id="drawerName">...</div>
                <div class="phone" id="drawerPhone">...</div>
            </div>
            <button class="close-btn" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div class="drawer-menu">
        <button class="menu-item" onclick="showProfile()">
            <i class="fas fa-user-circle"></i> الملف الشخصي
        </button>
        <button class="menu-item" onclick="goToContacts()">
            <i class="fas fa-address-book"></i> جهات الاتصال
        </button>
        <button class="menu-item add-account" onclick="addAccount()">
            <i class="fas fa-plus-circle"></i> إضافة حساب
        </button>
        <button class="menu-item" onclick="goToFolders()">
            <i class="fas fa-folder"></i> مجلدات المحادثات
        </button>
        <button class="menu-item" onclick="goToBookmarks()">
            <i class="fas fa-bookmark"></i> الرسائل المحفوظة
            <span class="badge-drawer" id="bookmarksBadge" style="display:none">0</span>
        </button>
        <button class="menu-item" onclick="goToCalls()">
            <i class="fas fa-phone"></i> المكالمات
        </button>
        <button class="menu-item" onclick="goToMediaGallery()">
            <i class="fas fa-images"></i> معرض الوسائط
        </button>
        <div class="divider"></div>
        <button class="menu-item" onclick="toggleTheme()">
            <i class="fas fa-moon" id="themeIcon"></i>
            <span id="themeLabel">الوضع المظلم</span>
        </button>
        <button class="menu-item" onclick="goToSettings()">
            <i class="fas fa-cog"></i> الإعدادات
        </button>
        <button class="menu-item" onclick="goToPrivacy()">
            <i class="fas fa-shield-alt"></i> الخصوصية والأمان
        </button>
        <div class="divider"></div>
        <button class="menu-item" onclick="doLogout()" style="color:#ff3b30;">
            <i class="fas fa-sign-out-alt" style="color:#ff3b30;"></i> تسجيل الخروج
        </button>
    </div>
</div>

<!-- ===== الحاوية الرئيسية ===== -->
<div class="app-container">

    <!-- ===== اللوح الأيسر ===== -->
    <div class="left-pane" id="leftPane">
        <div class="main-header">
            <div class="brand">
                <i class="fab fa-telegram-plane"></i>
                <span>تليجرام</span>
            </div>
            <div class="actions">
                <button onclick="toggleDrawer()" title="القائمة"><i class="fas fa-bars"></i></button>
                <button onclick="focusSearch()" title="بحث"><i class="fas fa-search"></i></button>
                <button onclick="refreshChats()" title="تحديث" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>
        <div class="search-bar">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="بحث عن محادثة..." oninput="filterChats(this.value)" />
            </div>
        </div>
        <div class="chat-list" id="chatList">
            <!-- سيتم ملؤها -->
            <div class="empty-state" id="loadingState">
                <i class="fas fa-spinner fa-spin"></i>
                <p>جاري تحميل المحادثات...</p>
            </div>
        </div>
    </div>

    <!-- ===== اللوح الأيمن ===== -->
    <div class="right-pane" id="rightPane">
        <!-- حالة لا توجد محادثة مختارة -->
        <div class="no-chat-state" id="noChatState">
            <i class="fab fa-telegram-plane"></i>
            <h3>مركز سرعة إنجاز</h3>
            <p>اختر محادثة لبدء التحدث</p>
        </div>

        <!-- واجهة المحادثة -->
        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <button class="back" onclick="closeChat()"><i class="fas fa-arrow-right"></i></button>
                <div class="h-info" onclick="showChatInfo()">
                    <div class="h-avatar" id="chatAvatar">؟</div>
                    <div class="h-details">
                        <div class="h-name" id="chatName">...</div>
                        <div class="h-status" id="chatStatus">...</div>
                    </div>
                </div>
                <div class="h-tools">
                    <button onclick="startVoiceCall()" title="مكالمة صوتية"><i class="fas fa-phone"></i></button>
                    <button onclick="searchInChat()" title="بحث في المحادثة"><i class="fas fa-search"></i></button>
                    <button onclick="showChatMenu()" title="المزيد"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>

            <!-- شريط الرد -->
            <div class="reply-bar" id="replyBar">
                <i class="fas fa-reply" style="color:var(--tg-blue);font-size:16px;"></i>
                <div class="reply-text" id="replyText">...</div>
                <button class="reply-cancel" onclick="cancelReply()"><i class="fas fa-times"></i></button>
            </div>

            <!-- منطقة الرسائل -->
            <div class="messages-area" id="messagesArea">
                <!-- الرسائل -->
            </div>

            <!-- مؤشر الكتابة -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="bubble">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <!-- شريط الإدخال -->
            <div class="input-area">
                <div class="input-wrap">
                    <button class="icon-btn" onclick="openFileUpload()" title="إرفاق ملف"><i class="fas fa-paperclip"></i></button>
                    <button class="icon-btn" onclick="showEmojiPicker()" title="إيموجي"><i class="far fa-smile"></i></button>
                    <textarea id="messageInput" rows="1"
                        placeholder="اكتب رسالتك..."
                        oninput="autoResize(this); onTyping();"
                        onkeydown="handleKeyDown(event)"></textarea>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="إرسال">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- رفع ملف مخفي -->
<input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(this)" multiple />

<!-- ===== JavaScript ===== -->
<script>
'use strict';

// ============================================================
//  المتغيرات الأساسية
// ============================================================
const CURRENT_USER_ID   = "{{ user_id }}";
const CURRENT_USER_NAME = "{{ user_name }}";

let socket            = null;
let chatsData         = [];         // بيانات المحادثات المحلية
let currentChatId     = null;       // معرف المحادثة المفتوحة
let currentChatData   = null;       // بيانات المحادثة المفتوحة
let replyToMsgId      = null;       // معرف الرسالة المراد الرد عليها
let typingTimer       = null;       // مؤقت مؤشر الكتابة
let isTyping          = false;
let chatMessages      = {};         // الرسائل المحملة { chat_id: [msgs] }
let currentTheme      = localStorage.getItem('theme') || 'dark';

// ============================================================
//  تهيئة Socket.IO
// ============================================================
function initSocket() {
    socket = io({ transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
        socket.emit('register_user', { user_id: CURRENT_USER_ID });
    });

    socket.on('disconnect', () => {
        showToast('⚠️ انقطع الاتصال، يُعاد الاتصال...', 'warning');
    });

    socket.on('reconnect', () => {
        showToast('✅ تم إعادة الاتصال', 'success');
        socket.emit('register_user', { user_id: CURRENT_USER_ID });
        if (currentChatId) socket.emit('join_chat', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
    });

    // استقبال رسالة جديدة
    socket.on('new_message', (msg) => {
        const chatId = msg.chat_id ? String(msg.chat_id) : null;
        if (!chatId) return;

        // تخزين الرسالة
        if (!chatMessages[chatId]) chatMessages[chatId] = [];
        chatMessages[chatId].push(msg);

        // إذا كانت المحادثة مفتوحة، أضف الرسالة مباشرة
        if (String(currentChatId) === chatId) {
            appendMessage(msg);
            // قراءة تلقائية
            socket.emit('mark_as_read', { user_id: CURRENT_USER_ID, chat_id: chatId });
        } else {
            // تحديث العداد في القائمة
            updateChatUnread(chatId);
            showToast(`📩 رسالة من ${msg.sender_name || 'مستخدم'}`, 'info');
        }

        // تحديث آخر رسالة في القائمة
        updateChatLastMsg(chatId, msg);
    });

    // تم إرسال الرسالة بنجاح
    socket.on('message_sent', (data) => {
        markMsgDelivered(data.message_id);
    });

    // خطأ في الإرسال
    socket.on('message_error', (data) => {
        showToast('❌ فشل إرسال الرسالة', 'error');
        markMsgFailed(data.message_id);
    });

    // مؤشر الكتابة
    socket.on('user_typing', (data) => {
        if (String(data.chat_id) === String(currentChatId) && String(data.user_id) !== CURRENT_USER_ID) {
            showTypingIndicator(data.is_typing, data.user_id);
        }
    });

    // رسالة محذوفة
    socket.on('message_deleted', (data) => {
        if (String(data.chat_id) === String(currentChatId)) {
            const el = document.querySelector(`[data-msg-id="${data.message_id}"]`);
            if (el) { el.style.opacity = '0.4'; el.querySelector('.text').textContent = '🗑️ تم حذف هذه الرسالة'; }
        }
    });

    // رسالة معدّلة
    socket.on('message_edited', (data) => {
        if (String(data.chat_id) === String(currentChatId)) {
            const el = document.querySelector(`[data-msg-id="${data.message_id}"] .text`);
            if (el) { el.textContent = data.new_text; }
        }
    });
}

// ============================================================
//  تحميل بيانات المستخدم
// ============================================================
async function loadUserInfo() {
    try {
        const res  = await fetch('/api/user/info');
        const data = await res.json();
        if (data.success && data.user) {
            const u = data.user;
            const name  = u.name  || CURRENT_USER_NAME || 'مستخدم';
            const phone = u.phone || '';
            document.getElementById('drawerName').textContent  = name;
            document.getElementById('drawerPhone').textContent = phone;
            document.getElementById('drawerAvatar').textContent = name.charAt(0);
        }
    } catch(e) {
        document.getElementById('drawerName').textContent  = CURRENT_USER_NAME || 'مستخدم';
        document.getElementById('drawerPhone').textContent = '';
        document.getElementById('drawerAvatar').textContent = (CURRENT_USER_NAME||'م').charAt(0);
    }
}

// ============================================================
//  تحميل المحادثات من الخادم
// ============================================================
async function loadChats(showLoader = true) {
    if (showLoader) {
        document.getElementById('chatList').innerHTML =
            '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>';
    }

    // تدوير أيقونة التحديث
    const btn = document.getElementById('refreshBtn').querySelector('i');
    btn.classList.add('fa-spin');

    try {
        const res  = await fetch('/api/chats?limit=50');
        const data = await res.json();

        if (!data.success) {
            throw new Error(data.message || 'فشل التحميل');
        }

        chatsData = (data.chats || []).map(c => ({
            id:           String(c.id),
            name:         c.name || 'محادثة',
            is_group:     c.is_group,
            is_channel:   c.is_channel,
            unread:       c.unread_count || 0,
            lastMsg:      c.last_message?.text || '',
            time:         c.last_message?.timestamp ? formatTime(c.last_message.timestamp) : '',
            pinned:       c.pinned,
            color:        avatarColor(String(c.id)),
            letter:       (c.name || 'م').charAt(0),
        }));

        renderChatList();
    } catch(e) {
        document.getElementById('chatList').innerHTML =
            `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>${e.message}</p></div>`;
        showToast('❌ ' + e.message, 'error');
    } finally {
        btn.classList.remove('fa-spin');
    }
}

// ============================================================
//  عرض قائمة المحادثات
// ============================================================
function renderChatList(search = '') {
    const list = document.getElementById('chatList');
    const q    = search.trim().toLowerCase();

    let filtered = chatsData.filter(c =>
        !q || c.name.toLowerCase().includes(q) || c.lastMsg.toLowerCase().includes(q)
    );

    if (!filtered.length) {
        list.innerHTML = `<div class="empty-state"><i class="fas fa-comment-slash"></i><p>${q ? 'لا توجد نتائج' : 'لا توجد محادثات'}</p></div>`;
        return;
    }

    list.innerHTML = filtered.map(c => `
        <div class="chat-item ${String(c.id) === String(currentChatId) ? 'active' : ''}"
             id="chat-item-${c.id}"
             onclick="selectChat('${c.id}')">
            <div class="avatar" style="background:${c.color};">
                ${c.letter}
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">${escHtml(c.name)}</span>
                    <span class="time">${c.time}</span>
                </div>
                <div class="preview">${escHtml(c.lastMsg)}</div>
            </div>
            ${c.unread > 0 ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}
        </div>
    `).join('');
}

// ============================================================
//  اختيار محادثة وفتحها
// ============================================================
async function selectChat(id) {
    id = String(id);

    // مغادرة الغرفة السابقة
    if (currentChatId && currentChatId !== id) {
        socket.emit('leave_chat', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
        stopTyping();
    }

    currentChatId   = id;
    currentChatData = chatsData.find(c => String(c.id) === id);

    // إلغاء الرد إن وجد
    cancelReply();

    // تحديث نشاط الغرفة
    socket.emit('join_chat', { user_id: CURRENT_USER_ID, chat_id: id });
    socket.emit('mark_as_read', { user_id: CURRENT_USER_ID, chat_id: id });

    // تحديث رأس المحادثة
    if (currentChatData) {
        document.getElementById('chatAvatar').textContent    = currentChatData.letter;
        document.getElementById('chatAvatar').style.background = currentChatData.color;
        document.getElementById('chatName').textContent      = currentChatData.name;
        document.getElementById('chatStatus').textContent    = currentChatData.is_group ? '👥 مجموعة' : '...';
        document.getElementById('chatStatus').className      = 'h-status';
    }

    // تصفير العداد في القائمة
    const item = document.querySelector(`#chat-item-${id}`);
    if (item) {
        const badge = item.querySelector('.badge');
        if (badge) badge.remove();
        const chat = chatsData.find(c => String(c.id) === id);
        if (chat) chat.unread = 0;
    }

    // فتح واجهة المحادثة
    openChatView();

    // عرض الرسائل (من الكاش أو الخادم)
    document.getElementById('messagesArea').innerHTML =
        '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>';

    await loadMessages(id);

    // تحديث نشاط القائمة
    renderChatList(document.getElementById('searchInput').value);
}

// ============================================================
//  تحميل الرسائل
// ============================================================
async function loadMessages(chatId) {
    try {
        const res  = await fetch(`/api/chats/${chatId}/messages?limit=50`);
        const data = await res.json();

        if (!data.success) throw new Error(data.message || 'فشل');

        const msgs = (data.messages || []).reverse();
        chatMessages[chatId] = msgs;
        renderMessages(msgs);
    } catch(e) {
        document.getElementById('messagesArea').innerHTML =
            `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>${e.message}</p></div>`;
    }
}

// ============================================================
//  عرض الرسائل
// ============================================================
function renderMessages(msgs) {
    const area = document.getElementById('messagesArea');
    if (!msgs.length) {
        area.innerHTML = '<div class="empty-state"><i class="far fa-comment-dots"></i><p>لا توجد رسائل بعد</p></div>';
        return;
    }

    let html = '';
    let lastDate = '';

    msgs.forEach(m => {
        const isSent = m.from_me || String(m.sender_id) === CURRENT_USER_ID;
        const cls    = isSent ? 'sent' : 'received';
        const time   = m.timestamp ? formatTime(m.timestamp) : '';
        const mDate  = m.timestamp ? formatDate(m.timestamp) : '';

        if (mDate && mDate !== lastDate) {
            html += `<div class="date-divider"><span>${mDate}</span></div>`;
            lastDate = mDate;
        }

        html += `
        <div class="msg ${cls}" data-msg-id="${m.id}" oncontextmenu="msgContextMenu(event,'${m.id}')">
            <div class="bubble">
                ${!isSent && m.sender_name ? `<div class="sender">${escHtml(m.sender_name)}</div>` : ''}
                <div class="text">${escHtml(m.text || '')}</div>
                <div class="foot">
                    <span>${time}</span>
                    ${isSent ? `<span class="ticks" id="tick-${m.id}">✓</span>` : ''}
                </div>
            </div>
        </div>`;
    });

    area.innerHTML = html;
    scrollToBottom();
}

// ============================================================
//  إضافة رسالة واحدة إلى النافذة
// ============================================================
function appendMessage(msg) {
    const area   = document.getElementById('messagesArea');
    const isSent = msg.from_me || String(msg.sender_id) === CURRENT_USER_ID;
    const cls    = isSent ? 'sent' : 'received';
    const time   = msg.timestamp ? formatTime(msg.timestamp) : formatTimeNow();

    // إزالة حالة الفراغ إن وجدت
    const empty = area.querySelector('.empty-state');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className  = `msg ${cls}`;
    div.dataset.msgId = msg.id || '';
    div.setAttribute('oncontextmenu', `msgContextMenu(event,'${msg.id}')`);
    div.innerHTML = `
        <div class="bubble">
            ${!isSent && msg.sender_name ? `<div class="sender">${escHtml(msg.sender_name)}</div>` : ''}
            <div class="text">${escHtml(msg.text || '')}</div>
            <div class="foot">
                <span>${time}</span>
                ${isSent ? `<span class="ticks" id="tick-${msg.id}">⏳</span>` : ''}
            </div>
        </div>`;
    area.appendChild(div);
    scrollToBottom();
}

// ============================================================
//  إرسال رسالة
// ============================================================
function sendMessage() {
    const input = document.getElementById('messageInput');
    const text  = input.value.trim();
    if (!text || !currentChatId) return;

    const msgId = 'local_' + Date.now();
    const now   = Math.floor(Date.now() / 1000);

    // عرض الرسالة محلياً فوراً
    const localMsg = {
        id:         msgId,
        sender_id:  CURRENT_USER_ID,
        sender_name: CURRENT_USER_NAME,
        text:       text,
        timestamp:  now,
        from_me:    true,
        chat_id:    currentChatId,
    };
    appendMessage(localMsg);

    // إرسال عبر Socket.IO
    socket.emit('send_message', {
        user_id:    CURRENT_USER_ID,
        chat_id:    currentChatId,
        text:       text,
        message_id: msgId,
        reply_to:   replyToMsgId || undefined,
    });

    // تحديث آخر رسالة في القائمة
    updateChatLastMsg(currentChatId, localMsg);

    // إعادة تعيين
    input.value = '';
    autoResize(input);
    cancelReply();
    stopTyping();
}

// ============================================================
//  مساعدات العرض
// ============================================================
function openChatView() {
    document.getElementById('chatView').classList.add('open');
    document.getElementById('noChatState').style.display = 'none';
    if (window.innerWidth <= 820) {
        document.getElementById('leftPane').classList.add('hidden');
    }
}

function closeChat() {
    currentChatId = null;
    document.getElementById('chatView').classList.remove('open');
    document.getElementById('noChatState').style.display = '';
    document.getElementById('leftPane').classList.remove('hidden');
    renderChatList(document.getElementById('searchInput').value);
}

function scrollToBottom() {
    const area = document.getElementById('messagesArea');
    area.scrollTop = area.scrollHeight;
}

function updateChatLastMsg(chatId, msg) {
    const chat = chatsData.find(c => String(c.id) === String(chatId));
    if (chat) {
        chat.lastMsg = msg.text || '';
        chat.time    = msg.timestamp ? formatTime(msg.timestamp) : formatTimeNow();
    }
    renderChatList(document.getElementById('searchInput').value);
}

function updateChatUnread(chatId) {
    const chat = chatsData.find(c => String(c.id) === String(chatId));
    if (chat) chat.unread = (chat.unread || 0) + 1;
    renderChatList(document.getElementById('searchInput').value);
}

function markMsgDelivered(msgId) {
    const el = document.getElementById('tick-' + msgId);
    if (el) el.textContent = '✓✓';
}

function markMsgFailed(msgId) {
    const el = document.querySelector(`[data-msg-id="${msgId}"]`);
    if (el) el.style.opacity = '0.5';
}

// ============================================================
//  مؤشر الكتابة
// ============================================================
function onTyping() {
    if (!currentChatId) return;
    if (!isTyping) {
        isTyping = true;
        socket.emit('typing_start', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(stopTyping, 3000);
}

function stopTyping() {
    if (isTyping && currentChatId) {
        socket.emit('typing_stop', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
    }
    isTyping = false;
    clearTimeout(typingTimer);
}

function showTypingIndicator(show, userId) {
    const el = document.getElementById('typingIndicator');
    el.classList.toggle('show', !!show);
    if (show) scrollToBottom();
}

// ============================================================
//  الرد على رسالة
// ============================================================
function replyTo(msgId, text) {
    replyToMsgId = msgId;
    document.getElementById('replyText').textContent = text;
    document.getElementById('replyBar').classList.add('show');
    document.getElementById('messageInput').focus();
}

function cancelReply() {
    replyToMsgId = null;
    document.getElementById('replyBar').classList.remove('show');
}

// ============================================================
//  قائمة السياق للرسائل
// ============================================================
function msgContextMenu(e, msgId) {
    e.preventDefault();
    const area  = document.getElementById('messagesArea');
    const msgEl = area.querySelector(`[data-msg-id="${msgId}"]`);
    if (!msgEl) return;
    const text  = msgEl.querySelector('.text')?.textContent || '';
    const isSent = msgEl.classList.contains('sent');

    // قائمة بسيطة
    const actions = [
        { label: '↩️ رد', fn: () => replyTo(msgId, text) },
        { label: '📋 نسخ', fn: () => navigator.clipboard.writeText(text).then(() => showToast('✅ تم النسخ', 'success')) },
    ];
    if (isSent) {
        actions.push({ label: '✏️ تعديل', fn: () => editMessage(msgId, text) });
        actions.push({ label: '🗑️ حذف', fn: () => deleteMessage(msgId) });
    }
    actions.push({ label: '⭐ حفظ', fn: () => bookmarkMessage(msgId, text) });

    showContextMenu(e.clientX, e.clientY, actions);
}

function showContextMenu(x, y, actions) {
    document.querySelectorAll('.ctx-menu').forEach(el => el.remove());
    const menu = document.createElement('div');
    menu.className = 'ctx-menu';
    menu.style.cssText = `
        position:fixed; left:${x}px; top:${y}px; z-index:9999;
        background:var(--tg-bg-secondary); border:1px solid var(--tg-border);
        border-radius:10px; padding:4px 0; box-shadow:var(--tg-shadow);
        min-width:140px; direction:rtl;
    `;
    actions.forEach(a => {
        const btn = document.createElement('button');
        btn.style.cssText = 'display:block;width:100%;padding:8px 14px;background:none;border:none;cursor:pointer;text-align:right;font-size:14px;font-family:Tajawal,sans-serif;color:var(--tg-text);';
        btn.textContent = a.label;
        btn.onmouseenter = () => btn.style.background = 'var(--tg-border)';
        btn.onmouseleave = () => btn.style.background = 'none';
        btn.onclick = () => { a.fn(); menu.remove(); };
        menu.appendChild(btn);
    });
    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 10);
}

// ============================================================
//  عمليات الرسائل (حذف / تعديل / حفظ)
// ============================================================
function deleteMessage(msgId) {
    if (!confirm('حذف هذه الرسالة؟')) return;
    socket.emit('delete_message', { user_id: CURRENT_USER_ID, chat_id: currentChatId, message_id: msgId });
    showToast('🗑️ جاري الحذف...', 'info');
}

function editMessage(msgId, currentText) {
    const newText = prompt('تعديل الرسالة:', currentText);
    if (!newText || newText === currentText) return;
    socket.emit('edit_message', {
        user_id: CURRENT_USER_ID, chat_id: currentChatId,
        message_id: msgId, new_text: newText
    });
    showToast('✏️ جاري التعديل...', 'info');
}

async function bookmarkMessage(msgId, text) {
    try {
        const res = await fetch('/api/messages/bookmark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: currentChatId, message_id: msgId, text })
        });
        const data = await res.json();
        showToast(data.success ? '⭐ تم الحفظ' : '❌ فشل الحفظ', data.success ? 'success' : 'error');
    } catch(e) { showToast('❌ خطأ في الاتصال', 'error'); }
}

// ============================================================
//  رفع الملفات
// ============================================================
function openFileUpload() {
    document.getElementById('fileInput').click();
}

async function handleFileSelect(input) {
    if (!input.files.length || !currentChatId) return;
    const file = input.files[0];
    showToast(`📎 جاري رفع ${file.name}...`, 'info');

    const fd = new FormData();
    fd.append('file', file);
    try {
        const res  = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.success) {
            // إرسال رابط الملف كرسالة
            document.getElementById('messageInput').value = `📎 ${data.original || file.name}: ${data.url}`;
            sendMessage();
            showToast('✅ تم رفع الملف', 'success');
        } else {
            showToast('❌ ' + (data.message || 'فشل الرفع'), 'error');
        }
    } catch(e) { showToast('❌ خطأ أثناء الرفع', 'error'); }
    input.value = '';
}

// ============================================================
//  المكالمة الصوتية
// ============================================================
function startVoiceCall() {
    if (!currentChatId) return;
    if (currentChatData && currentChatData.is_group) {
        showToast('📞 المكالمات الصوتية غير متاحة للمجموعات', 'warning');

    }
    window.open(`/call/${currentChatId}`, '_blank', 'width=400,height=600');
}

// ============================================================
//  بحث في المحادثة
// ============================================================
async function searchInChat() {
    const q = prompt('بحث في المحادثة:');
    if (!q) return;
    try {
        const res  = await fetch(`/api/search?q=${encodeURIComponent(q)}&chat_id=${currentChatId}`);
        const data = await res.json();
        if (data.success && data.results?.length) {
            showToast(`🔍 ${data.results.length} نتيجة`, 'info');
        } else {
            showToast('🔍 لا توجد نتائج', 'info');
        }
    } catch(e) { showToast('❌ خطأ في البحث', 'error'); }
}

// ============================================================
//  قائمة المحادثة (ellipsis)

function showChatMenu() {

        const data = await res.json();
        showToast(data.success ? '🔇 تم الكتم' : '❌ فشل', data.success ? 'success' : 'error');

}

async function archiveChat() {
    try {
        const res  = await fetch(`/api/chats/${currentChatId}/archive`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ archived: true }) });
        const data = await res.json();
        showToast(data.success ? '📁 تم الأرشفة' : '❌ فشل', data.success ? 'success' : 'error');

}

function showChatInfo() {

// ============================================================
//  السمة (Dark / Light)
// ============================================================
function applyTheme(theme) {
    currentTheme = theme;
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    const icon  = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if (theme === 'dark') {
        icon.className  = 'fas fa-sun';
        label.textContent = 'الوضع الفاتح';
    } else {
        icon.className  = 'fas fa-moon';
        label.textContent = 'الوضع المظلم';
    }
    // حفظ في الخادم
    fetch('/api/settings/theme', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme })
    }).catch(() => {});
}

function toggleTheme() {
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

// ============================================================
//  الدروير
// ============================================================
function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('drawerOverlay').classList.toggle('open');
}
function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
}

// ============================================================
//  مساعدات عامة
// ============================================================
function filterChats(q) { renderChatList(q); }
function refreshChats() { loadChats(); }
function focusSearch() { document.getElementById('searchInput').focus(); }
function showEmojiPicker() { showToast('😊 ميزة الإيموجي قريباً', 'info'); }

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast     = document.createElement('div');
    toast.className = `toast-custom ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 350);
    }, 3500);
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts) {
    const d = new Date(ts * 1000);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function formatTimeNow() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function formatDate(ts) {
    const d   = new Date(ts * 1000);
    const now = new Date();
    const diff = Math.floor((now - d) / 86400000);
    if (diff === 0) return 'اليوم';
    if (diff === 1) return 'الأمس';
    return d.toLocaleDateString('ar-SA', { day: 'numeric', month: 'long' });
}

function avatarColor(id) {
    const colors = ['#6c5ce7','#00d2ff','#ff6b6b','#f9ca24','#2ecc71','#e17055','#a29bfe','#fd79a8','#00b894','#0984e3'];
    let hash = 0;
    for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
    return colors[Math.abs(hash) % colors.length];
}
