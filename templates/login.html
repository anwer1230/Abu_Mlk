<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز سرعة إنجاز — تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
            margin: 0; padding: 0;
        }
        body {
            background: #0d0d1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .stars {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }
        .stars::before, .stars::after {
            content: '';
            position: absolute; inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.4), transparent),
                radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,.3), transparent),
                radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.5), transparent),
                radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,.4), transparent),
                radial-gradient(1px 1px at 35% 15%, rgba(255,255,255,.5), transparent),
                radial-gradient(1px 1px at 65% 85%, rgba(255,255,255,.3), transparent),
                radial-gradient(1px 1px at 5%  45%, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 95% 40%, rgba(255,255,255,.4), transparent);
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        .stars::after {
            background-image:
                radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,.5), transparent),
                radial-gradient(1px 1px at 75% 25%, rgba(255,255,255,.3), transparent),
                radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 60% 5%,  rgba(255,255,255,.4), transparent),
                radial-gradient(1px 1px at 25% 90%, rgba(255,255,255,.5), transparent),
                radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,.3), transparent);
            animation-delay: 2s;
        }
        @keyframes twinkle { from { opacity:.5 } to { opacity:1 } }

        .login-wrapper {
            position: relative; z-index: 1;
            width: 100%; max-width: 480px;
            padding: 16px;
        }
        .login-card {
            background: linear-gradient(145deg,
                rgba(26,26,46,.97) 0%,
                rgba(22,33,62,.97) 100%);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 28px;
            padding: 44px 40px;
            box-shadow:
                0 40px 80px rgba(0,0,0,.6),
                0 0 0 1px rgba(0,210,255,.04) inset;
            backdrop-filter: blur(20px);
        }

        /* شعار */
        .logo { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            font-size: 52px; display: block; margin-bottom: 12px;
            filter: drop-shadow(0 0 20px rgba(0,210,255,.5));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .logo h1 {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .logo p { color: #6b7db3; font-size: 13px; }

        /* مراحل الدخول */
        .step { display: none; }
        .step.active { display: block; animation: fadeIn .35s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

        /* التسميات */
        .field-label {
            font-size: 12px; font-weight: 600;
            color: #8899cc; letter-spacing: .5px;
            text-transform: uppercase; margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }

        /* ========================================
           حقل الهاتف المدمج مع كود الدولة
           ======================================== */
        .phone-field-wrapper {
            margin-bottom: 20px;
        }
        .phone-input-row {
            display: flex;
            align-items: stretch;
            background: rgba(255,255,255,.04);
            border: 1.5px solid rgba(255,255,255,.08);
            border-radius: 14px;
            overflow: hidden;
            transition: all .25s;
        }
        .phone-input-row:focus-within {
            border-color: rgba(0,210,255,.5);
            background: rgba(0,210,255,.04);
            box-shadow: 0 0 0 4px rgba(0,210,255,.08);
        }

        /* جزء الدولة */
        .country-part {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 14px;
            border-left: 1.5px solid rgba(255,255,255,.08);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 110px;
            position: relative;
            user-select: none;
            transition: background .2s;
        }
        [dir="rtl"] .country-part {
            border-left: none;
            border-right: 1.5px solid rgba(255,255,255,.08);
        }
        .country-part:hover { background: rgba(255,255,255,.04); }
        .country-flag { font-size: 20px; line-height: 1; }
        .country-code-text {
            font-size: 15px; font-weight: 700;
            color: #00d2ff; direction: ltr;
        }
        .country-arrow {
            font-size: 9px; color: #3d4878;
            transition: transform .2s;
        }
        .country-part.open .country-arrow { transform: rotate(180deg); }

        /* قائمة الدول */
        .country-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            left: 0;
            width: 320px;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.7);
            z-index: 999;
            overflow: hidden;
            max-height: 320px;
            flex-direction: column;
        }
        [dir="rtl"] .country-dropdown { right: auto; left: 0; }
        .country-dropdown.open { display: flex; }
        .country-search-wrap {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,.06);
            flex-shrink: 0;
        }
        .country-search-wrap input {
            width: 100%; background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
            padding: 7px 12px; color: #e8eaf6; font-size: 13px;
            font-family: 'Tajawal',sans-serif; outline: none;
        }
        .country-search-wrap input::placeholder { color: #3d4878; }
        .country-list {
            overflow-y: auto; flex: 1;
        }
        .country-list::-webkit-scrollbar { width: 3px; }
        .country-list::-webkit-scrollbar-thumb { background: #00d2ff40; border-radius: 3px; }
        .country-option {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 14px; cursor: pointer;
            transition: background .15s;
            font-size: 14px; color: #c8d0e8;
        }
        .country-option:hover { background: rgba(0,210,255,.08); }
        .country-option.selected { background: rgba(0,210,255,.12); color: #00d2ff; }
        .country-option .opt-flag { font-size: 18px; }
        .country-option .opt-name { flex: 1; }
        .country-option .opt-code { color: #00d2ff; font-weight: 700; font-size: 13px; direction: ltr; }

        /* جزء الرقم */
        .phone-number-part {
            flex: 1;
            display: flex;
            align-items: center;
        }
        .phone-number-part input {
            width: 100%; padding: 14px 16px;
            background: none; border: none;
            color: #e8eaf6; font-size: 16px;
            font-family: 'Tajawal', monospace;
            outline: none; direction: ltr;
            letter-spacing: 1px;
        }
        .phone-number-part input::placeholder { color: #3d4878; }

        /* مؤشر الدولة المكتشفة */
        .detected-country {
            display: none;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 6px 12px;
            background: rgba(0,210,255,.08);
            border-radius: 8px;
            border: 1px solid rgba(0,210,255,.15);
            font-size: 12px;
            color: #5dddff;
            animation: fadeIn .3s ease;
        }
        .detected-country.show { display: flex; }

        /* حقول عادية */
        .input-wrap { position: relative; margin-bottom: 20px; }
        .input-wrap input {
            width: 100%; padding: 14px 44px 14px 18px;
            background: rgba(255,255,255,.04);
            border: 1.5px solid rgba(255,255,255,.08);
            border-radius: 14px; color: #e8eaf6;
            font-size: 15px; font-family: 'Tajawal', monospace;
            transition: all .25s; outline: none;
        }
        [dir="rtl"] .input-wrap input { padding: 14px 18px 14px 44px; }
        .input-wrap input::placeholder { color: #3d4878; }
        .input-wrap input:focus {
            border-color: rgba(0,210,255,.5);
            background: rgba(0,210,255,.04);
            box-shadow: 0 0 0 4px rgba(0,210,255,.08);
        }
        .input-wrap .input-icon {
            position: absolute; top: 50%; transform: translateY(-50%);
            left: 16px; color: #3d4878; font-size: 16px; pointer-events: none;
        }
        [dir="rtl"] .input-wrap .input-icon { left: auto; right: 16px; }

        /* زر */
        .btn-primary-grad {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border: none; border-radius: 14px;
            color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all .3s;
            position: relative; overflow: hidden;
        }
        .btn-primary-grad::after {
            content:''; position:absolute; inset:0;
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
            opacity:0; transition:opacity .3s;
        }
        .btn-primary-grad:hover:not(:disabled)::after { opacity:1; }
        .btn-primary-grad span { position:relative; z-index:1; }
        .btn-primary-grad:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0,210,255,.35);
        }
        .btn-primary-grad:disabled { opacity:.55; cursor:not-allowed; }

        /* spinner */
        .spinner {
            display:inline-block; width:16px; height:16px;
            border:2px solid rgba(255,255,255,.3);
            border-top-color:#fff; border-radius:50%;
            animation:spin .7s linear infinite;
            vertical-align:middle; margin-inline-end:6px;
        }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* رسائل */
        .msg-box {
            padding:10px 14px; border-radius:10px;
            font-size:13px; margin-top:12px; display:none;
        }
        .msg-box.show { display:block; }
        .msg-box.error   { background:rgba(255,71,87,.12); color:#ff6b7a; border:1px solid rgba(255,71,87,.25); }
        .msg-box.success { background:rgba(46,204,113,.12); color:#56d48e; border:1px solid rgba(46,204,113,.25); }
        .msg-box.info    { background:rgba(0,210,255,.10);  color:#5dddff; border:1px solid rgba(0,210,255,.2); }

        /* تذييل */
        .card-footer {
            margin-top:28px; text-align:center;
            padding-top:20px;
            border-top:1px solid rgba(255,255,255,.05);
        }
        .card-footer p { color:#4a5680; font-size:12px; }

        /* مؤشر التقدم */
        .steps-indicator {
            display:flex; justify-content:center; gap:8px; margin-bottom:28px;
        }
        .step-dot {
            width:8px; height:8px; border-radius:50%;
            background:rgba(255,255,255,.1); transition:all .3s;
        }
        .step-dot.active {
            background:#00d2ff;
            box-shadow:0 0 10px rgba(0,210,255,.6);
            width:24px; border-radius:4px;
        }
        .step-dot.done { background:rgba(0,210,255,.4); }

        /* toast */
        .toast-wrap {
            position:fixed; bottom:24px; right:24px;
            z-index:9999; display:flex; flex-direction:column; gap:8px;
        }
        .toast-item {
            background:rgba(26,26,46,.98);
            border:1px solid rgba(255,255,255,.08);
            border-radius:14px; padding:14px 18px;
            min-width:260px; max-width:340px;
            box-shadow:0 16px 40px rgba(0,0,0,.5);
            animation:slideIn .3s ease; transition:all .3s;
        }
        @keyframes slideIn {
            from{opacity:0;transform:translateX(40px)}
            to{opacity:1;transform:none}
        }
        .toast-item.success { border-right:4px solid #2ecc71; }
        .toast-item.error   { border-right:4px solid #ff4757; }
        .toast-item.info    { border-right:4px solid #00d2ff; }
        .toast-title { font-weight:700; font-size:14px; color:#e8eaf6; }
        .toast-body  { font-size:12px; color:#6b7db3; margin-top:2px; }

        @media (max-width:480px) {
            .login-card { padding:32px 20px; }
            .logo h1 { font-size:22px; }
            .country-dropdown { width:280px; }
        }
    </style>
</head>
<body>

<div class="stars"></div>

<div class="login-wrapper">
    <div class="login-card">

        <div class="logo">
            <span class="logo-icon">🚀</span>
            <h1>مركز سرعة إنجاز</h1>
            <p>سجّل الدخول للوصول إلى محادثاتك</p>
        </div>

        <div class="steps-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot"        id="dot2"></div>
            <div class="step-dot"        id="dot3"></div>
        </div>

        <!-- ══ الخطوة 1: رقم الهاتف مع كود الدولة ══ -->
        <div class="step active" id="step1">
            <div class="phone-field-wrapper">
                <label class="field-label">
                    <i class="fas fa-mobile-alt"></i> رقم الهاتف مع كود الدولة
                </label>

                <div class="phone-input-row" id="phoneInputRow">
                    <!-- جزء الدولة -->
                    <div class="country-part" id="countryPart" onclick="toggleCountryDropdown()">
                        <span class="country-flag" id="selectedFlag">🌍</span>
                        <span class="country-code-text" id="selectedCode">+</span>
                        <i class="fas fa-chevron-down country-arrow" id="countryArrow"></i>

                        <!-- قائمة الدول -->
                        <div class="country-dropdown" id="countryDropdown">
                            <div class="country-search-wrap">
                                <input type="text" id="countrySearch"
                                       placeholder="ابحث عن دولة..."
                                       oninput="filterCountries(this.value)"
                                       onclick="event.stopPropagation()" />
                            </div>
                            <div class="country-list" id="countryList"></div>
                        </div>
                    </div>

                    <!-- جزء الرقم -->
                    <div class="phone-number-part">
                        <input type="tel" id="phoneNumberInput"
                               placeholder="5xxxxxxxx"
                               oninput="onPhoneInput(this.value)"
                               autocomplete="tel-national"
                               inputmode="tel" />
                    </div>
                </div>

                <!-- مؤشر الدولة المكتشفة تلقائياً -->
                <div class="detected-country" id="detectedCountry">
                    <span id="detectedFlag">🌍</span>
                    <span id="detectedName">جاري الكشف...</span>
                    <i class="fas fa-check-circle" style="color:#2ecc71;margin-right:auto"></i>
                </div>
            </div>

            <button class="btn-primary-grad" id="sendCodeBtn" onclick="doSendCode()">
                <span>إرسال كود التحقق</span>
            </button>
            <div class="msg-box" id="phoneMsg"></div>
        </div>

        <!-- ══ الخطوة 2: كود التحقق ══ -->
        <div class="step" id="step2">
            <div class="input-wrap">
                <label class="field-label"><i class="fas fa-key"></i> كود التحقق</label>
                <input type="text" id="codeInput"
                       placeholder="أدخل الكود المُرسل"
                       dir="ltr" autocomplete="one-time-code" maxlength="6"
                       inputmode="numeric">
                <i class="fas fa-shield-alt input-icon"></i>
            </div>
            <button class="btn-primary-grad" id="checkCodeBtn" onclick="doCheckCode()">
                <span>تأكيد الكود</span>
            </button>
            <div class="msg-box info show" id="codeHint">
                📱 تم إرسال الكود إلى <span id="codePhoneDisplay"></span> عبر تليجرام
            </div>
            <div class="msg-box" id="codeMsg"></div>
            <p style="text-align:center;margin-top:14px;font-size:12px;color:#4a5680">
                <a href="#" onclick="goBack()" style="color:#00d2ff;text-decoration:none">
                    ← تغيير رقم الهاتف
                </a>
            </p>
        </div>

        <!-- ══ الخطوة 3: 2FA ══ -->
        <div class="step" id="step3">
            <div class="input-wrap">
                <label class="field-label"><i class="fas fa-lock"></i> كلمة المرور (التحقق الثنائي)</label>
                <input type="password" id="passwordInput"
                       placeholder="أدخل كلمة المرور"
                       dir="ltr" autocomplete="current-password">
                <i class="fas fa-lock input-icon"></i>
            </div>
            <button class="btn-primary-grad" id="checkPasswordBtn" onclick="doCheckPassword()">
                <span>تأكيد كلمة المرور</span>
            </button>
            <div class="msg-box info show" style="margin-top:14px">
                🔐 حسابك محمي بالتحقق الثنائي، أدخل كلمة المرور لإكمال الدخول
            </div>
            <div class="msg-box" id="passwordMsg"></div>
        </div>

        <div class="card-footer">
            <p>
                <i class="fas fa-shield-alt" style="color:#00d2ff"></i>
                جميع البيانات مشفرة وآمنة • مدعوم بـ Telegram
            </p>
        </div>

    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>

    { code: '+234', name: 'نيجيريا',             flag: '🇳🇬', iso: 'NG', prefix: ['7','8','9'] },
    { code: '+254', name: 'كينيا',               flag: '🇰🇪', iso: 'KE', prefix: ['7'] },
    { code: '+55',  name: 'البرازيل',            flag: '🇧🇷', iso: 'BR', prefix: [] },
    { code: '+52',  name: 'المكسيك',             flag: '🇲🇽', iso: 'MX', prefix: ['1'] },
    { code: '+27',  name: 'جنوب أفريقيا',        flag: '🇿🇦', iso: 'ZA', prefix: ['6','7','8'] },
    { code: '+61',  name: 'أستراليا',            flag: '🇦🇺', iso: 'AU', prefix: ['4'] },
    { code: '+81',  name: 'اليابان',             flag: '🇯🇵', iso: 'JP', prefix: ['7','8','9'] },
    { code: '+82',  name: 'كوريا الجنوبية',      flag: '🇰🇷', iso: 'KR', prefix: ['1'] },
];

// ترتيب حسب طول الكود تنازلياً (أولاً الأطول لمنع التعارض)
const SORTED_BY_CODE_LEN = [...COUNTRIES].sort((a,b) => b.code.length - a.code.length);

// ═══════════════════════════════════════════════════════════════
//  الحالة العامة
// ═══════════════════════════════════════════════════════════════
let selectedCountry = COUNTRIES[0]; // السعودية افتراضياً
let loginPhone      = '';
let currentStep     = 1;
let dropdownOpen    = false;

// ═══════════════════════════════════════════════════════════════
//  بناء قائمة الدول
// ═══════════════════════════════════════════════════════════════
function buildCountryList(filter = '') {
    const list = document.getElementById('countryList');
    const q    = filter.toLowerCase();
    const filtered = q
        ? COUNTRIES.filter(c => c.name.includes(q) || c.code.includes(q) || c.iso.toLowerCase().includes(q))
        : COUNTRIES;

    list.innerHTML = filtered.map(c => `
        <div class="country-option ${c.iso === selectedCountry.iso ? 'selected' : ''}"
             onclick="selectCountry('${c.iso}')">
            <span class="opt-flag">${c.flag}</span>
            <span class="opt-name">${c.name}</span>
            <span class="opt-code">${c.code}</span>
        </div>
    `).join('');
}

function selectCountry(iso) {
    const c = COUNTRIES.find(x => x.iso === iso);
    if (!c) return;
    selectedCountry = c;
    document.getElementById('selectedFlag').textContent = c.flag;
    document.getElementById('selectedCode').textContent = c.code;
    closeCountryDropdown();
    updateDetectedCountry(c);
    document.getElementById('phoneNumberInput').focus();
}

function updateDetectedCountry(c) {
    if (!c) {
        document.getElementById('detectedCountry').classList.remove('show');
        return;
    }
    document.getElementById('detectedFlag').textContent = c.flag;
    document.getElementById('detectedName').textContent = c.name + ' (' + c.code + ')';
    document.getElementById('detectedCountry').classList.add('show');
}

// ═══════════════════════════════════════════════════════════════
//  الكشف التلقائي عن الدولة من الرقم المكتوب
// ═══════════════════════════════════════════════════════════════
function onPhoneInput(val) {
    // تنظيف: اترك الأرقام فقط
    const cleaned = val.replace(/\D/g, '');

    // إذا بدأ المستخدم بـ + نكتشف من الكود الكامل
    const rawInput = document.getElementById('phoneNumberInput').value;
    if (rawInput.startsWith('+')) {
        const withPlus = rawInput;
        const found = SORTED_BY_CODE_LEN.find(c => withPlus.startsWith(c.code));
        if (found) {
            selectedCountry = found;
            document.getElementById('selectedFlag').textContent = found.flag;
            document.getElementById('selectedCode').textContent = found.code;
            updateDetectedCountry(found);
            // اقتطع الكود من حقل الرقم
            document.getElementById('phoneNumberInput').value = withPlus.slice(found.code.length).trim();
        }
        return;
    }

    // اكتشاف من أول رقم مع الكود المختار مسبقاً
    updateDetectedCountry(selectedCountry);
}

// ═══════════════════════════════════════════════════════════════
//  التحكم في قائمة الدول
// ═══════════════════════════════════════════════════════════════
function toggleCountryDropdown() {
    dropdownOpen ? closeCountryDropdown() : openCountryDropdown();
}

function openCountryDropdown() {
    dropdownOpen = true;
    document.getElementById('countryDropdown').classList.add('open');
    document.getElementById('countryPart').classList.add('open');
    buildCountryList();
    setTimeout(() => document.getElementById('countrySearch').focus(), 50);
}

function closeCountryDropdown() {
    dropdownOpen = false;
    document.getElementById('countryDropdown').classList.remove('open');
    document.getElementById('countryPart').classList.remove('open');
    document.getElementById('countrySearch').value = '';
}

function filterCountries(q) {
    buildCountryList(q);
}

// إغلاق عند النقر خارجاً
document.addEventListener('click', (e) => {
    if (dropdownOpen && !document.getElementById('countryPart').contains(e.target)) {
        closeCountryDropdown();
    }
});

// ═══════════════════════════════════════════════════════════════
//  بناء الرقم الكامل
// ═══════════════════════════════════════════════════════════════
function buildFullPhone() {
    const num = document.getElementById('phoneNumberInput').value.replace(/\s/g, '');
    if (!num) return '';
    // تجنب التكرار إذا أدخل المستخدم الكود مع الرقم
    if (num.startsWith('+')) return num;
    return selectedCountry.code + num;
}

// ═══════════════════════════════════════════════════════════════
//  التنقل بين الخطوات
// ═══════════════════════════════════════════════════════════════
function showStep(n) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');
    [1,2,3].forEach(i => {
        const dot = document.getElementById('dot' + i);
        dot.classList.remove('active','done');
        if (i < n)  dot.classList.add('done');
        if (i === n) dot.classList.add('active');
    });
    currentStep = n;
}

function goBack() {
    if (currentStep > 1) showStep(currentStep - 1);
}

// ═══════════════════════════════════════════════════════════════
//  دوال مساعدة
// ═══════════════════════════════════════════════════════════════
function showMsg(id, text, type = 'error') {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    el.className = `msg-box ${type} show`;
}
function clearMsg(id) {
    const el = document.getElementById(id);
    if (el) el.className = 'msg-box';
}
function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.disabled = loading;
    btn.querySelector('span').innerHTML = loading
        ? '<span class="spinner"></span> جاري...'
        : label;
}
function toast(message, type = 'info') {
    const wrap = document.getElementById('toastWrap');
    const el   = document.createElement('div');
    el.className = `toast-item ${type}`;
    const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
    el.innerHTML = `<div class="toast-title">${icon} ${message}</div>`;
    wrap.appendChild(el);
    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(40px)';
        setTimeout(() => el.remove(), 300);
    }, 4500);
}

// ═══════════════════════════════════════════════════════════════
//  الخطوة 1: إرسال الكود
// ═══════════════════════════════════════════════════════════════
async function doSendCode() {
    const phone = buildFullPhone();
    if (!phone || phone.length < 7) {
        showMsg('phoneMsg', '⚠️ يرجى إدخال رقم الهاتف مع كود الدولة');
        return;
    }
    clearMsg('phoneMsg');
    setLoading('sendCodeBtn', true, 'إرسال كود التحقق');

    try {
        const res  = await fetch('/api/auth/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
        });
        const data = await res.json();

        if (data.success) {
            loginPhone = phone;
            document.getElementById('codePhoneDisplay').textContent = phone;
            showStep(2);
            setTimeout(() => document.getElementById('codeInput').focus(), 100);
            toast('تم إرسال الكود إلى ' + phone, 'success');
        } else {
            showMsg('phoneMsg', '❌ ' + data.message, 'error');
            toast(data.message, 'error');
        }
    } catch {
        showMsg('phoneMsg', '❌ حدث خطأ في الاتصال بالخادم', 'error');
        toast('خطأ في الاتصال', 'error');
    }
    setLoading('sendCodeBtn', false, 'إرسال كود التحقق');
}

// ═══════════════════════════════════════════════════════════════
//  الخطوة 2: التحقق من الكود
// ═══════════════════════════════════════════════════════════════
async function doCheckCode() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) { showMsg('codeMsg', '⚠️ يرجى إدخال الكود'); return; }
    clearMsg('codeMsg');
    setLoading('checkCodeBtn', true, 'تأكيد الكود');

    try {
        const res  = await fetch('/api/auth/check-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: loginPhone, code })
        });
        const data = await res.json();

        if (data.success) {
            toast('مرحباً! تم تسجيل الدخول بنجاح 🎉', 'success');
            setTimeout(() => window.location.href = '/', 800);
        } else if (data.requires_password) {
            showStep(3);
            setTimeout(() => document.getElementById('passwordInput').focus(), 100);
            toast('يتطلب كلمة المرور الثنائية', 'info');
        } else {
            showMsg('codeMsg', '❌ ' + data.message, 'error');
            toast(data.message, 'error');
        }
    } catch {
        showMsg('codeMsg', '❌ حدث خطأ في الاتصال', 'error');
    }
    setLoading('checkCodeBtn', false, 'تأكيد الكود');
}

// ═══════════════════════════════════════════════════════════════
//  الخطوة 3: 2FA
// ═══════════════════════════════════════════════════════════════
async function doCheckPassword() {
    const password = document.getElementById('passwordInput').value;
    if (!password) { showMsg('passwordMsg', '⚠️ يرجى إدخال كلمة المرور'); return; }
    clearMsg('passwordMsg');
    setLoading('checkPasswordBtn', true, 'تأكيد كلمة المرور');

    try {
        const res  = await fetch('/api/auth/check-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: loginPhone, password })
        });
        const data = await res.json();

        if (data.success) {
            toast('مرحباً! تم تسجيل الدخول بنجاح 🎉', 'success');
            setTimeout(() => window.location.href = '/', 800);
        } else {
            showMsg('passwordMsg', '❌ ' + data.message, 'error');
            toast(data.message, 'error');
        }
    } catch {
        showMsg('passwordMsg', '❌ حدث خطأ في الاتصال', 'error');
    }
    setLoading('checkPasswordBtn', false, 'تأكيد كلمة المرور');
}

// ═══════════════════════════════════════════════════════════════
//  مفاتيح Enter
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (currentStep === 1) doSendCode();
    if (currentStep === 2) doCheckCode();
    if (currentStep === 3) doCheckPassword();
});

// ═══════════════════════════════════════════════════════════════
//  تهيئة الصفحة
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
    // ضبط الدولة الافتراضية
    document.getElementById('selectedFlag').textContent = selectedCountry.flag;
    document.getElementById('selectedCode').textContent = selectedCountry.code;
    updateDetectedCountry(selectedCountry);

    // التحقق من جلسة موجودة
    fetch('/api/auth/status').then(r => r.json()).then(d => {
        if (d.is_authenticated) window.location.href = '/';
    }).catch(() => {});
});
</script>
